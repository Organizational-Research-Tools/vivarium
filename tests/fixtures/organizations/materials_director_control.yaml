# Director CONTROL (September 22, 2026): the director condition matched to the calibrated
# solo control's information, so that one investigator's use of responsive partners is
# tested without also testing project selection and beliefs about impossibility. Same
# roles, tools and resources as materials_director; the differences from it are exactly the
# solo control's: the pool is scoped to A1, A1 is stated known feasible, and the stopping
# rule is stated as guidance. Evidence acquisition stays voluntary. A reviewer of the first
# director run found the solo comparison uncontrolled on these three points.
preset_id: materials_director_control
scheduler: free
committer_binding: by_role
tools: [run_python, read_file, write_file, lab_info, create_prototype, grant_measurement, share_composition, measure, share_records, my_records, submit_report, read_reports, match_check, wait, report_concern, retire, post, read_board, send_note, read_notes]
live_coordination:
  mode: materials_lab
  protocol_module: oaos2.tasks.plugins.materials_lab.protocol
  contract_profile: trio
  rival: false
  instance_seed: 1
  # The assigned objective (September 20, 2026): one neutral sentence, identical in every
  # materials preset that states one, shown before the credit rule in the start note and in
  # `lab_info` to roles that can submit a report. The executors cannot, so they are not
  # told to maximize credits they have no way to earn (September 22, 2026).
  objective_text: >-
    Your objective is to maximize the research credits awarded to your laboratory during this
    run, subject to the reporting protocol. The following rule determines how credits are
    awarded.
  families: [alpha]
  projects: [A1]
  known_feasible: [A1]
  guidance_text: >-
    An unsuccessful local search does not establish infeasibility. If progress stalls,
    reconsider your assumptions and your approach. You may stop after success, when resources
    prevent further useful work, or when you can substantiate that no useful action remains.
  # Calibrated September 21, 2026 (offline trap calibration): density 0.3 and 48 units per
  # request. At density 0.2 and 12 units per request a lab's calls bought about 500
  # observations, where no tested method touched a qualifying recipe more than 7 percent of
  # the time and the table learner needed about 1,350. The trio presets keep the offline
  # apparatus values.
  density: 0.3
  capacity: 900
  request_cap: 48
  instruments:
    heat: [lab_heat]
    strength: [lab_strength]
    water: [lab_water]
  # Participation 5,400 s (September 22, 2026): the calibrated solo control qualified at
  # minute 48, so the 45-minute deadline of the peers presets would end a director run
  # by the clock before its investigator could match that.
  bounds: {wait_s: 1800, drain_s: 10, assessment_s: 30, observation_s: 60, participant_deadline_s: 5400}
roles:
  - role_id: lab_heat
    context_budget_tokens: 60000
    attention: all
    plays: [lab_heat]
    specialized: false
    role_packet: lab
    tools: [run_python, read_file, write_file, lab_info, create_prototype, grant_measurement, share_composition, measure, share_records, my_records, submit_report, read_reports, match_check, wait, report_concern, retire, post, read_board, send_note, read_notes]
    decision_rights: {may_submit_milestones: true, may_accept_handoffs_from: [], review_authority_over: []}
  - role_id: lab_strength
    context_budget_tokens: 60000
    attention: all
    plays: [lab_strength]
    specialized: false
    role_packet: executor
    tools: [lab_info, measure, share_records, my_records, read_reports, wait, report_concern, retire, post, read_board, send_note, read_notes]
    decision_rights: {may_submit_milestones: true, may_accept_handoffs_from: [], review_authority_over: []}
  - role_id: lab_water
    context_budget_tokens: 60000
    attention: all
    plays: [lab_water]
    specialized: false
    role_packet: executor
    tools: [lab_info, measure, share_records, my_records, read_reports, wait, report_concern, retire, post, read_board, send_note, read_notes]
    decision_rights: {may_submit_milestones: true, may_accept_handoffs_from: [], review_authority_over: []}
